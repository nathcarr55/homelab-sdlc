name: AI SDLC

on:
  workflow_call:
    inputs:
      stack:
        description: "Tech stack hint for the agents (e.g. vue+fastapi+postgres)"
        required: false
        type: string
        default: "unknown"
      test_command:
        description: "Command to run tests (e.g. npm test, pytest)"
        required: false
        type: string
        default: "echo no tests configured"
      python_version:
        description: "Python version for agent scripts"
        required: false
        type: string
        default: "3.12"
    secrets:
      TAILSCALE_AUTHKEY:
        required: true
      LITELLM_URL:
        required: true
      LITELLM_MASTER_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-task:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.12' }}

      - name: Install agent dependencies
        run: pip install openai PyGithub requests anthropic

      - name: Checkout agent scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homelab-sdlc
          path: .sdlc
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Verify LiteLLM reachable
        run: |
          echo "Pinging LiteLLM at ${{ secrets.LITELLM_URL }}..."
          curl -sf ${{ secrets.LITELLM_URL }}/health -H "Authorization: Bearer ${{ secrets.LITELLM_MASTER_KEY }}" || (echo "LiteLLM unreachable - check Tailscale connection" && exit 1)

      - name: Run planning agent
        id: plan
        env:
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_FULL_NAME: ${{ github.repository }}
          STACK: ${{ inputs.stack || 'unknown' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .sdlc/agents/plan.py

      - name: Run coding agent
        id: code
        env:
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          STACK: ${{ inputs.stack || 'unknown' }}
          TASK_PLAN: ${{ steps.plan.outputs.task_plan }}
        run: python .sdlc/agents/code.py

      - name: Test and fix loop
        id: test_loop
        continue-on-error: true
        env:
          TEST_COMMAND: ${{ inputs.test_command || 'echo no tests configured' }}
          MAX_ATTEMPTS: "6"
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          STACK: ${{ inputs.stack || 'unknown' }}
          TASK_PLAN: ${{ steps.plan.outputs.task_plan }}
          POSTGRES_SERVER: localhost
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
          POSTGRES_PORT: "5432"
          FIRST_SUPERUSER: admin@example.com
          FIRST_SUPERUSER_PASSWORD: testpassword123
          SECRET_KEY: testsecretkey
          PROJECT_NAME: "Sweetheart City Roastery"
        run: python .sdlc/agents/test_loop.py

      - name: Run review agent
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TASK_PLAN: ${{ steps.plan.outputs.task_plan }}
          STACK: ${{ inputs.stack || 'unknown' }}
          REVIEW_ATTEMPT: "1"
        run: python .sdlc/agents/review.py

      - name: Retry coding agent on review rejection
        if: steps.review.outputs.approved == 'false'
        env:
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          STACK: ${{ inputs.stack || 'unknown' }}
          TASK_PLAN: ${{ steps.plan.outputs.task_plan }}
          REVIEW_FEEDBACK: ${{ steps.review.outputs.feedback }}
        run: python .sdlc/agents/code.py

      - name: Test and fix loop (post-review)
        id: test_loop2
        if: steps.review.outputs.approved == 'false'
        continue-on-error: true
        env:
          TEST_COMMAND: ${{ inputs.test_command || 'echo no tests configured' }}
          MAX_ATTEMPTS: "4"
          LOOP_LABEL: "post-review"
          REVIEW_FEEDBACK: ${{ steps.review.outputs.feedback }}
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          STACK: ${{ inputs.stack || 'unknown' }}
          TASK_PLAN: ${{ steps.plan.outputs.task_plan }}
          POSTGRES_SERVER: localhost
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
          POSTGRES_PORT: "5432"
          FIRST_SUPERUSER: admin@example.com
          FIRST_SUPERUSER_PASSWORD: testpassword123
          SECRET_KEY: testsecretkey
          PROJECT_NAME: "Sweetheart City Roastery"
        run: python .sdlc/agents/test_loop.py

      - name: Re-run review agent after rejection retry
        id: review2
        if: steps.review.outputs.approved == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TASK_PLAN: ${{ steps.plan.outputs.task_plan }}
          STACK: ${{ inputs.stack || 'unknown' }}
          REVIEW_ATTEMPT: "2"
        run: python .sdlc/agents/review.py

      - name: Open pull request
        env:
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TASK_PLAN: ${{ steps.plan.outputs.task_plan }}
          TESTS_PASSED: ${{ steps.test_loop2.outputs.tests_passed || steps.test_loop.outputs.tests_passed }}
          REVIEW_APPROVED: ${{ steps.review2.outputs.approved || steps.review.outputs.approved }}
        run: python .sdlc/agents/pr.py
